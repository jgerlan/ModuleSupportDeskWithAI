name: supportdesk-litellm
services:
  litellm:
    image: ghcr.io/berriai/litellm@sha256:c560d317136880ea92d62334d4367ab10955b1af189dd3ea24f6551290b1d6c1
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?Run scripts/Configure-LiteLlm.ps1 first}"
      LITELLM_LOG: ERROR
      LITELLM_OFFLINE_MODE: "true"
      LITELLM_TELEMETRY: "false"

